upstream web {
    server web:3000;
}

upstream auth_service {
    server auth-service:4001;
}

upstream projects_service {
    server projects-service:4002;
}

upstream tasks_service {
    server tasks-service:4003;
}

upstream notifications_service {
    server notifications-service:4004;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Frontend
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth service
    location /api/auth/ {
        proxy_pass http://auth_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Projects service
    location /api/projects/ {
        proxy_pass http://projects_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tasks service
    location /api/tasks/ {
        proxy_pass http://tasks_service/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Notifications service
    location /api/notifications/ {
        proxy_pass http://notifications_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger docs - Auth
    location /docs/auth/ {
        proxy_pass http://auth_service/api-docs/;
        proxy_set_header Host $host;
    }

    # Swagger docs - Projects
    location /docs/projects/ {
        proxy_pass http://projects_service/api-docs/;
        proxy_set_header Host $host;
    }

    # Swagger docs - Tasks
    location /docs/tasks/ {
        proxy_pass http://tasks_service/api-docs/;
        proxy_set_header Host $host;
    }

    # Swagger docs - Notifications
    location /docs/notifications/ {
        proxy_pass http://notifications_service/api-docs/;
        proxy_set_header Host $host;
    }
}
