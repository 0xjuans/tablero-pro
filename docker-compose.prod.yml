name: tablero-pro-prod

services:
  # ─── API Gateway ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tablero-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: always
    networks:
      - tablero-network

  # ─── Frontend ────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tablero-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${APP_URL}
    restart: always
    mem_limit: 300m
    networks:
      - tablero-network

  # ─── Auth Service ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: tablero-auth
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: always
    mem_limit: 150m
    networks:
      - tablero-network

  # ─── Projects Service ─────────────────────────────────────────────────────────
  projects-service:
    build:
      context: .
      dockerfile: services/projects-service/Dockerfile
    container_name: tablero-projects
    environment:
      - NODE_ENV=production
      - PORT=4002
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    restart: always
    mem_limit: 150m
    networks:
      - tablero-network

  # ─── Tasks Service ────────────────────────────────────────────────────────────
  tasks-service:
    build:
      context: .
      dockerfile: services/tasks-service/Dockerfile
    container_name: tablero-tasks
    environment:
      - NODE_ENV=production
      - PORT=4003
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
    restart: always
    mem_limit: 150m
    networks:
      - tablero-network

  # ─── Notifications Service ────────────────────────────────────────────────────
  notifications-service:
    build:
      context: .
      dockerfile: services/notifications-service/Dockerfile
    container_name: tablero-notifications
    environment:
      - NODE_ENV=production
      - PORT=4004
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SES_FROM_EMAIL=${AWS_SES_FROM_EMAIL}
    restart: always
    mem_limit: 150m
    networks:
      - tablero-network

networks:
  tablero-network:
    driver: bridge
